name: Frontend
on:
  push:
    paths: ['frontend/**', '.node-version', 'docs/api/**', 'docs/DEVELOPMENT_SPEC.md', 'scripts/*contract*', 'backend/src/main/java/com/ticketshop/admin/common/api/ErrorCode.java', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', '.node-version', 'docs/api/**', 'docs/DEVELOPMENT_SPEC.md', 'scripts/*contract*', 'backend/src/main/java/com/ticketshop/admin/common/api/ErrorCode.java', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack pnpm@11.25.0 install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ../scripts/contract-requirements.txt
      - run: python ../scripts/validate-api-contract.py
      - run: corepack pnpm@11.25.0 api:check
      - run: corepack pnpm@11.25.0 typecheck
      - run: corepack pnpm@11.25.0 lint:check
      - run: corepack pnpm@11.25.0 test:unit
      - run: corepack pnpm@11.25.0 build
      - run: corepack pnpm@11.25.0 exec playwright install --with-deps chromium
      - run: corepack pnpm@11.25.0 test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: frontend/test-results
