name: Backend
on:
  push:
    paths: ['backend/**', 'frontend/**', 'scripts/verify-bootstrap-cli.py', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', 'scripts/verify-bootstrap-cli.py', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack pnpm@11.25.0 --dir frontend install --frozen-lockfile
      - run: corepack pnpm@11.25.0 --dir frontend exec playwright install --with-deps chromium
      - run: ./backend/mvnw -B -f backend/pom.xml verify
        env:
          P3_BROWSER: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/failsafe-reports/*.xml
