  /api/v1/client/logout:
    post:
      operationId: clientLogout
      tags:
      - client
      summary: 桌面退出
      description: 只处理本身份域已验证的JWT；已撤销或过期凭据重复退出成功；不披露账号信息。断网本地清理不代表服务端已撤销。
