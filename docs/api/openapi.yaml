      summary: 管理员登录
      description: 预认证Cookie＋CSRF＋允许Origin；消费预认证，成功轮换管理Cookie和CSRF。脚本不接收JWT；首次改密仅受限会话。
      security:
      - PreAuthCookie: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      - $ref: '#/components/parameters/Csrf'
      - $ref: '#/components/parameters/Origin'
