        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '426':
          $ref: '#/components/responses/426'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-permissions:
      - client:self
      x-purpose:
      - NORMAL
  /api/v1/client/password:
    post:
      operationId: clientPassword
      tags:
      - client
      summary: 桌面用户改密
      description: 桌面用户改密
      security:
      - ClientBearer: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 业务提交成功；PENDING为数据库已提交、Redis待同步。
