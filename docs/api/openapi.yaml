      x-purpose:
      - NORMAL
      - PASSWORD_CHANGE
  /api/v1/admin/auth/csrf:
    get:
      operationId: adminCsrf
      tags:
      - admin-auth
      summary: 获取或轮换CSRF
      description: 无会话时创建最长10分钟预认证Cookie；已有有效管理Cookie时绑定并轮换该会话CSRF。限允许Origin与频率。原值只进入前端内存，不回显旧值。 GET可无Origin：须校验同源Sec-Fetch-Site/Referer；若携带Origin必须严格匹配，不要求脚本设置浏览器禁用头。
      security: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 成功，只读请求不延长管理员空闲期限。
          headers:
            Cache-Control: *id001
            X-Request-Id: *id002
            Set-Cookie:
              schema:
                type: string
              description: host-only HttpOnly；生产Secure；SameSite=Strict；Path=/api/v1/admin。JWT仅Cookie承载；不返回脚本。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCsrfResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '426':
          $ref: '#/components/responses/426'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-permissions: []
      x-purpose: []
  /api/v1/admin/auth/login:
