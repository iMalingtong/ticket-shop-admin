components:
  securitySchemes:
    ClientBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256；client audience、CUSTOMER principalType；仅Java侧持有。
    AdminCookie:
      type: apiKey
      in: cookie
      name: tsa_admin_session
      description: HttpOnly JWT；admin audience、ADMIN principalType；CSRF绑定，脚本不可读。
    PreAuthCookie:
      type: apiKey
      in: cookie
      name: tsa_admin_pre_auth
      description: 随机预认证绑定；非JWT，最长10分钟，登录消费。
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
      description: 内存CSRF值；不得记录。
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: 必须匹配配置的后台同源Origin；不得信任任意来源。
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: UUID；按管理员和键唯一保留24小时；不得自动重试写入。
    Correlation:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]+$
      description: 可选关联输入，服务端仍生成自己的requestId。
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        enum:
        - 10
        - 20
        - 50
        - 100
        default: 20
  responses:
    '400':
      description: VALIDATION_ERROR; PROTOCOL_INVALID
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
    '401':
      description: INVALID_CREDENTIALS; SESSION_EXPIRED; SESSION_REVOKED; PASSWORD_CHANGE_TOKEN_INVALID; SESSION_INVALID
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
    '403':
      description: ACCOUNT_FROZEN; ACCOUNT_DISABLED; ACCOUNT_NOT_STARTED; ACCOUNT_EXPIRED; PASSWORD_CHANGE_REQUIRED; FORBIDDEN;
        CSRF_INVALID
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
    '404':
      description: RESOURCE_NOT_FOUND
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
    '409':
      description: VERSION_CONFLICT; USERNAME_EXISTS; INVALID_STATE_TRANSITION; LAST_SUPER_ADMIN; IDEMPOTENCY_CONFLICT
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
    '426':
      description: CLIENT_UPDATE_REQUIRED; PROTOCOL_UNSUPPORTED
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error426'
    '429':
      description: LOGIN_RATE_LIMITED
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: 下次允许尝试的秒数。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error429'
    '503':
      description: SERVICE_UNAVAILABLE; MAINTENANCE
      headers:
        Cache-Control: *id001
        X-Request-Id: *id002
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error503'
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^[1-9][0-9]{0,18}$
      description: 正十进制ID字符串；不超过9223372036854775807，不得转为JS number。
      example: '9007199254740993'
    Version:
      type: string
      minLength: 1
      maxLength: 19
      pattern: ^(0|[1-9][0-9]{0,18})$
      description: 非负并发版本字符串；不超过9223372036854775807。
      example: '0'
    UtcInstant:
      type: string
      format: date-time
      pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z$
      description: UTC ISO8601，最多6位小数，必须Z结尾；到期为排他上界。 MySQL DATETIME范围1000–9999年。
      example: '2026-11-03T00:00:00Z'
    Username:
      type: string
      minLength: 3
      maxLength: 64
      pattern: ^[A-Za-z0-9._-]{3,64}$
      description: 提交前trim；服务端Locale.ROOT小写唯一键，显示保留大小写。
    Password:
      type: string
      minLength: 12
      maxLength: 128
      format: password
      writeOnly: true
      description: 12–128 Unicode码点；不trim、不截断，不回显或记录。
    Reason:
      type: string
      minLength: 1
      maxLength: 500
    CustomerStatus:
      type: string
      enum:
      - ACTIVE
      - FROZEN
      - DISABLED
    TermStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_TERM
      - EXPIRED
    Purpose:
      type: string
      enum:
      - NORMAL
      - PASSWORD_CHANGE
    AdminRole:
      type: string
      enum:
      - SUPER_ADMIN
      - OPERATOR
    CacheSyncStatus:
      type: string
      enum:
      - SYNCED
      - PENDING
    Permission:
      type: string
      enum:
      - dashboard:read
      - customer:read
      - customer:create
      - customer:update
      - customer:state
      - customer:validity
      - customer:password-reset
      - customer-session:read
      - customer-session:revoke
      - customer-audit:read
      - customer-security:read
      - customer-security:unlock
      - admin:read
      - admin:create
      - admin:update
      - admin:state
      - admin:password-reset
      - admin-audit:read
      - admin-security:read
      - admin-security:unlock
      - policy:read
      - policy:update
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - PROTOCOL_INVALID
      - INVALID_CREDENTIALS
      - SESSION_EXPIRED
      - SESSION_REVOKED
      - PASSWORD_CHANGE_TOKEN_INVALID
