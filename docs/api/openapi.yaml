openapi: 3.0.3
info:
  title: 票小理账号授权与管理API
  version: 1.0.0
  description: P2设计契约；路径尚未开放。所有数据为账号授权数据，不接收票据/附件。成功和错误均含服务器requestId/serverNow；所有响应no-store。JSON请求≤32KiB；拒绝未知字段。无refresh、自助注册、删除或导出接口。
  license:
    name: Private project API contract
servers:
- url: http://127.0.0.1:18080
  description: 仅本机开发；生产必须HTTPS同源管理后台
tags:
- name: client
  description: 桌面Java侧Bearer身份
- name: admin-auth
  description: 管理Cookie、内存CSRF与Origin
- name: management
  description: 逐条服务器权限；写请求CSRF＋幂等键＋版本
paths:
  /api/v1/client/login:
    post:
      operationId: clientLogin
      tags:
      - client
      summary: 桌面登录
      description: 无注册/refresh接口；不自动重试。NORMAL结果包含资格；CHANGE_PASSWORD不授予工作资格。密码正确之后才披露资格拒绝原因。
      security: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 业务提交成功；PENDING为数据库已提交、Redis待同步。
          headers:
            Cache-Control: &id001
              schema:
                type: string
                enum:
                - no-store
              description: 所有业务响应禁止缓存。
            X-Request-Id: &id002
              schema:
                type: string
                minLength: 1
                maxLength: 64
              description: 服务端生成，与响应体一致。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientLoginResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '426':
          $ref: '#/components/responses/426'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-permissions: []
      x-purpose: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientLoginRequest'
  /api/v1/client/first-password:
    post:
      operationId: clientFirstPassword
      tags:
      - client
      summary: 桌面首次改密
      description: 仅PASSWORD_CHANGE用途；同事务消费受限凭据、改密并撤销全部旧会话，必须重新登录。
      security:
      - ClientBearer: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 业务提交成功；PENDING为数据库已提交、Redis待同步。
          headers:
            Cache-Control: *id001
            X-Request-Id: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientFirstPasswordResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '426':
          $ref: '#/components/responses/426'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-permissions:
      - client:self
      x-purpose:
      - PASSWORD_CHANGE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirstPasswordRequest'
  /api/v1/client/validate:
    post:
      operationId: clientValidate
      tags:
      - client
      summary: 联网资格校验
      description: 更新lastValidatedAt；数据库与Redis任一不可用503；不得滑动绝对到期时间。
      security:
      - ClientBearer: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 业务提交成功；PENDING为数据库已提交、Redis待同步。
          headers:
            Cache-Control: *id001
            X-Request-Id: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientValidateResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '426':
          $ref: '#/components/responses/426'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
      x-permissions:
      - client:self
      x-purpose:
      - NORMAL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
  /api/v1/client/account:
    get:
      operationId: clientAccount
      tags:
      - client
      summary: 本人资料与资格
      description: 检查资格但不更新lastValidatedAt；不能用于心跳续窗口。
      security:
      - ClientBearer: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      responses:
        '200':
          description: 成功，只读请求不延长管理员空闲期限。
          headers:
            Cache-Control: *id001
            X-Request-Id: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientAccountResponse'
        '400':
