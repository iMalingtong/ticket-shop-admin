  /api/v1/admin/users:
    get:
      operationId: listCustomers
      tags:
      - management
      summary: 查询客户
      description: 全结果过滤排序后分页；id同向稳定次序；lastLoginAt为空始终排最后；范围[from,to)。
      security:
      - AdminCookie: []
      parameters:
      - $ref: '#/components/parameters/Correlation'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          minLength: 0
          maxLength: 64
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CustomerStatus'
      - name: termStatus
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/TermStatus'
      - name: validUntilFrom
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UtcInstant'
        description: 包含下界
      - name: validUntilTo
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UtcInstant'
        description: 不包含上界
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - createdAt:asc
          - createdAt:desc
          - validUntil:asc
          - validUntil:desc
          - lastLoginAt:asc
          - lastLoginAt:desc
          default: createdAt:desc
      responses:
        '200':
          description: 成功，只读请求不延长管理员空闲期限。
          headers:
            Cache-Control: *id001
            X-Request-Id: *id002
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCustomersResponse'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '426':
          $ref: '#/components/responses/426'
        '429':
          $ref: '#/components/responses/429'
